# CI : pytest à chaque push et pull request.
# Pas de secrets, pas d'appel OpenSky / NewsAPI / OpenWeather.
# .env.example fournit des placeholders pour pydantic-settings.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Installer les dépendances CI
        run: pip install -r requirements-ci.txt
      - name: Préparer un .env sans secret
        run: cp .env.example .env
      - name: Lancer pytest
        run: python -m pytest -q
